name: Safe dependency audit repair

on:
  push:
    branches: [fix/dependency-audit-2026-09-19]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-audit-2026-09-19
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Synchronize lockfile for reviewed package changes
        if: ${{ !contains(github.event.head_commit.message, 'Apply reviewed dependency fixes') }}
        run: npm install --package-lock-only --ignore-scripts
      - name: Apply additional non-breaking audit fixes
        if: ${{ !contains(github.event.head_commit.message, 'Apply reviewed dependency fixes') }}
        run: npm audit fix --package-lock-only --omit=dev || true
      - name: Commit reviewed lockfile changes
        if: ${{ !contains(github.event.head_commit.message, 'Apply reviewed dependency fixes') }}
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile is already synchronized."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "Apply reviewed dependency fixes"
            git push origin HEAD:fix/dependency-audit-2026-09-19
          fi
      - run: npm ci
      - name: Production dependency audit
        run: npm audit --omit=dev || true
