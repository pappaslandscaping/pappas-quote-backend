name: Picomatch lock sync

on:
  push:
    branches: [security/dependency-remediation-2026-09-19]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation-2026-09-19
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify zero vulnerabilities
        shell: bash
        run: |
          npm audit --json > audit-zero.json || true
          node <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('audit-zero.json','utf8'));
          const total = audit.metadata?.vulnerabilities?.total || 0;
          console.log('AUDIT_ZERO_METADATA=' + JSON.stringify(audit.metadata || {}));
          console.log('AUDIT_ZERO_VULNERABILITIES=' + JSON.stringify(audit.vulnerabilities || {}));
          if (total !== 0) process.exit(1);
          NODE
      - name: Commit lockfile and remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/picomatch-lock-sync.yml
          git commit -m "Regenerate lockfile with patched Picomatch"
          git push origin HEAD:security/dependency-remediation-2026-09-19
