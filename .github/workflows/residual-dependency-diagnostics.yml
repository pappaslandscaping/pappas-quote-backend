name: Residual dependency diagnostics

on:
  push:
    branches: [security/dependency-remediation-2026-09-19]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/dependency-remediation-2026-09-19
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Show residual vulnerable chains
        shell: bash
        run: |
          echo PICOMATCH_TREE_BEGIN
          npm ls picomatch --all || true
          echo PICOMATCH_TREE_END
          echo QUERY_STRING_TREE_BEGIN
          npm ls intuit-oauth query-string decode-uri-component --all || true
          echo QUERY_STRING_TREE_END
      - name: Remove this one-time workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/residual-dependency-diagnostics.yml
          git commit -m "Remove one-time dependency diagnostics"
          git push origin HEAD:security/dependency-remediation-2026-09-19
