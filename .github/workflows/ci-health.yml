name: CI and health checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JWT_SECRET: ci-only-not-a-production-secret
      NODE_OPTIONS: --experimental-vm-modules
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run portable backend unit suite
        run: >-
          npx jest --runInBand
          --testPathIgnorePatterns='tests/(quote-flow|cron-automation|invoice-webhook|square-payment|customer-portal|renderTemplate|broadcast-targeting-preview-route|app-mms-media)\.test\.js'
      - name: Test broadcast preview targeting
        run: >-
          npx jest --runInBand tests/broadcast-targeting-preview-route.test.js
          --testNamePattern='uses live-job activity first|uses live-job service_date first|live customer name fallback|does not fall back to stale scheduled_jobs'
      - name: Test backend MMS handling
        run: >-
          npx jest --runInBand tests/app-mms-media.test.js
          --testNamePattern='inbound Twilio MMS media|app MMS send route|old MMS backfill|production MMS backfill endpoint'
      - name: Explain intentionally excluded stale tests
        run: |
          echo "renderTemplate.test.js targets a server export that no longer exists."
          echo "Broadcast send tests are excluded because backend customer communications are intentionally disabled and the route returns 403 before send logic."
          echo "The mobile transform assertion in app-mms-media.test.js depends on a sibling TwilioConnect checkout and is covered in TwilioConnect CI instead."
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run build

  production-health:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check YardDesk production health endpoint
        env:
          HEALTHCHECK_URL: ${{ vars.HEALTHCHECK_URL }}
        run: |
          HEALTHCHECK_URL="${HEALTHCHECK_URL:-https://app.pappaslandscaping.com/health}"
          curl --fail --silent --show-error --retry 3 --retry-all-errors --max-time 20 "$HEALTHCHECK_URL"
